<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The kiosk runs Chromium with --force-dark-mode; declaring the page's own
     scheme stops it re-processing colours we already chose for dark. -->
<meta name="color-scheme" content="dark">
<title>Weather</title>
<style>
  /* Everything is sized in rem against a root that tracks the panel width, so
     the layout is resolution-independent: it fills 1080x1920 on the wall and
     still reads correctly in a small test window. */
  html { font-size: calc(100vw / 1080 * 16); }

  :root {
    color-scheme: dark;
    --surface:  #0d1014;   /* matches the shell, so view swaps don't flash */
    --ink:      #e6edf3;
    --ink-2:    #c9d3dd;   /* secondary — units, legend     12.6:1 on surface */
    --ink-3:    #bcc7d3;   /* axis ticks, small labels      11.1:1 on surface */
    /* Both cleared for small text at viewing distance. The old --ink-3
       (#5d6773) measured 3.32:1, under the 4.5:1 floor, which is why the axis
       ticks and unit suffixes were hard to read on the wall. Don't darken
       these back down without re-measuring. */
    --hairline: rgba(230,237,243,.09);

    /* Series colours, validated for this surface (dark, categorical):
       orange <-> violet is deltaE 26.0 under deuteranopia. Don't re-pick by eye. */
    --temp:  #d95926;
    --feels: #9085e9;
    --rain:  #3987e5;
    --night: rgba(255,255,255,.022);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    background: var(--surface);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    height: 100%;
    padding: 5.5rem 5rem 4rem;
    display: flex;
    flex-direction: column;
  }

  /* ---- header ---------------------------------------------------------- */
  .place {
    font-size: 1.9rem; font-weight: 600; letter-spacing: .22em;
    text-transform: uppercase; color: var(--ink-2);
  }
  .date { margin-top: .6rem; font-size: 2.1rem; color: var(--ink-3); }

  /* ---- hero ------------------------------------------------------------ */
  .hero { margin-top: 4.5rem; display: flex; align-items: flex-start; gap: 2rem; }
  .now-temp { font-size: 14rem; line-height: .86; font-weight: 200; letter-spacing: -.04em; }
  .now-temp .deg { color: var(--ink-3); }
  .hero-icon { margin-top: .9rem; flex: none; color: var(--ink-2); }
  .hero-icon svg { width: 7.5rem; height: 7.5rem; }
  .condition { margin-top: 1.8rem; font-size: 2.8rem; font-weight: 500; }
  .feels { margin-top: .6rem; font-size: 2.1rem; color: var(--ink-2); }
  .feels b { color: var(--feels); font-weight: 600; }

  /* ---- stat row -------------------------------------------------------- */
  .stats {
    margin-top: 4rem; padding-top: 2.6rem;
    border-top: 1px solid var(--hairline);
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.6rem;
  }
  .stat-k {
    font-size: 1.6rem; letter-spacing: .17em; text-transform: uppercase;
    color: var(--ink-3);
  }
  .stat-v { margin-top: .7rem; font-size: 2.9rem; font-weight: 500; }
  .stat-v small {
    display: block;                /* the qualifier no longer fits beside the
                                      value at this size; stacking it keeps
                                      neighbouring cells from running together */
    font-size: 2rem; font-weight: 500; color: var(--ink-2);
    margin: .35rem 0 0 0;
  }

  /* ---- charts ---------------------------------------------------------- */
  .section { margin-top: 4.6rem; }
  .section-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 1.1rem;
  }
  .section-title {
    font-size: 1.8rem; letter-spacing: .17em; text-transform: uppercase;
    color: var(--ink-3);
  }
  .section-note { font-size: 1.8rem; color: var(--ink-2); }

  /* Legend is always present for two series; the dash on "feels like" is a
     second, non-colour cue so identity never rests on hue alone. */
  .legend { display: flex; gap: 2rem; align-items: center; }
  .legend span { display: flex; align-items: center; gap: .5rem;
                 font-size: 1.8rem; color: var(--ink-2); }
  .swatch { display: inline-block; width: 1.5rem; height: 0; border-top: 2px solid currentColor; }
  .swatch.solid  { color: var(--temp); }
  .swatch.dashed { color: var(--feels); border-top-style: dashed; }

  svg { display: block; width: 100%; }
  .grid    { stroke: var(--hairline); stroke-width: 1; }
  .axis    { fill: var(--ink-3); font-size: 40px; font-weight: 500; }
  .lbl     { font-size: 40px; font-weight: 600; }

  /* ---- footer ---------------------------------------------------------- */
  .footer {
    margin-top: auto; padding-top: 2.6rem;
    border-top: 1px solid var(--hairline);
    display: flex; justify-content: space-between; align-items: center;
    font-size: 2rem; color: var(--ink-3);
  }
  .sun { display: flex; gap: 2.2rem; }
  .stale { color: #d9843b; }
</style>
</head>
<body>
<div class="page">
  <div class="place" id="place">&mdash;</div>
  <div class="date"  id="date"></div>

  <div class="hero">
    <div>
      <div class="now-temp"><span id="nowTemp">&ndash;</span><span class="deg">&deg;</span></div>
      <div class="condition" id="condition"></div>
      <div class="feels" id="feelsLine"></div>
    </div>
    <div class="hero-icon" id="heroIcon"></div>
  </div>

  <div class="stats" id="stats"></div>

  <div class="section">
    <div class="section-head">
      <div class="section-title">Temperature &middot; next 24 h</div>
      <div class="legend">
        <span><i class="swatch solid"></i>Actual</span>
        <span><i class="swatch dashed"></i>Feels like</span>
      </div>
    </div>
    <div id="tempChart"></div>
  </div>

  <div class="section">
    <div class="section-head">
      <div class="section-title">Rain</div>
      <div class="section-note" id="rainNote"></div>
    </div>
    <div id="rainChart"></div>
  </div>

  <div class="footer">
    <div class="sun"><span id="sunrise"></span><span id="sunset"></span></div>
    <div id="updated"></div>
  </div>
</div>

<!-- Site-specific values (places) live in config.js, which is gitignored.
     This page is an iframe, so it loads its own copy rather than
     inheriting window.CONFIG from index.html. -->
<script src="config.js"></script>
<script>
"use strict";

/* ------------------------------------------------------------------ config
   Places are named in config.js (CONFIG.places), so no coordinates sit in a
   file that ships. The first entry there is the default; the URL can override
   the key, or give raw coordinates and skip config entirely:

     weather.html                          -> CONFIG.places, first entry
     weather.html?place=<key>              -> that entry
     weather.html?lat=..&lon=..&name=..    -> ad hoc, no config needed
*/
var PLACES = (window.CONFIG && window.CONFIG.places) || {};
var KEYS   = Object.keys(PLACES);

var q      = new URLSearchParams(location.search);
var preset = PLACES[(q.get("place") || KEYS[0] || "").toLowerCase()] ||
             PLACES[KEYS[0]] || {};
var PLACE  = {
  name: q.get("name") || preset.name || "—",
  lat:  parseFloat(q.get("lat")) || preset.lat,
  lon:  parseFloat(q.get("lon")) || preset.lon
};
var HOURS      = 24;
var REFRESH_MS = 10 * 60 * 1000;
var CACHE_KEY  = "wallpanel.weather." + PLACE.lat + "," + PLACE.lon;

/* --------------------------------------------------------------- wmo codes */
function describe(code) {
  var t = {
    0:  ["Clear", "clear"],          1:  ["Mainly clear", "clear"],
    2:  ["Partly cloudy", "partly"], 3:  ["Overcast", "cloudy"],
    45: ["Fog", "fog"],              48: ["Rime fog", "fog"],
    51: ["Light drizzle", "drizzle"],53: ["Drizzle", "drizzle"],
    55: ["Heavy drizzle", "drizzle"],56: ["Freezing drizzle", "drizzle"],
    57: ["Freezing drizzle", "drizzle"],
    61: ["Light rain", "rain"],      63: ["Rain", "rain"],
    65: ["Heavy rain", "rain"],      66: ["Freezing rain", "rain"],
    67: ["Freezing rain", "rain"],   71: ["Light snow", "snow"],
    73: ["Snow", "snow"],            75: ["Heavy snow", "snow"],
    77: ["Snow grains", "snow"],     80: ["Light showers", "rain"],
    81: ["Showers", "rain"],         82: ["Heavy showers", "rain"],
    85: ["Snow showers", "snow"],    86: ["Snow showers", "snow"],
    95: ["Thunderstorm", "thunder"], 96: ["Thunderstorm", "thunder"],
    99: ["Thunderstorm", "thunder"]
  };
  return t[code] || ["—", "cloudy"];
}

/* Minimal line art: one stroke weight, no fills, so the icon sits quietly
   beside the type instead of competing with it. */
function icon(kind) {
  var open = '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" ' +
             'stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">';
  var sun   = '<circle cx="24" cy="21" r="7.5"/>' +
              '<path d="M24 6v3M24 33v3M9 21h3M36 21h3M13.4 10.4l2.1 2.1' +
              'M32.5 29.5l2.1 2.1M34.6 10.4l-2.1 2.1M15.5 29.5l-2.1 2.1"/>';
  var cloud = '<path d="M15 34h18a7 7 0 0 0 .6-14 10 10 0 0 0-19.2 2.4A6.5 6.5 0 0 0 15 34z"/>';
  var light = '<path d="M17 39l-1.5 4M25 39l-1.5 4M33 39l-1.5 4"/>';
  var heavy = '<path d="M16 38l-2 6M24 38l-2 6M32 38l-2 6"/>';
  var snow  = '<path d="M15.5 39.5l3 3M18.5 39.5l-3 3M23.5 39.5l3 3' +
              'M26.5 39.5l-3 3M31.5 39.5l3 3M34.5 39.5l-3 3"/>';
  var bolt  = '<path d="M26 37l-6 5h5l-2 6"/>';
  var map = {
    clear:   sun,
    partly:  '<circle cx="18" cy="16" r="5.5"/>' +
             '<path d="M18 5v2.5M7 16h2.5M10.2 8.2l1.8 1.8M25.8 8.2L24 10"/>' + cloud,
    cloudy:  cloud,
    fog:     cloud + '<path d="M12 39h24M15 44h18"/>',
    drizzle: cloud + light,
    rain:    cloud + heavy,
    snow:    cloud + snow,
    thunder: cloud + bolt
  };
  return open + (map[kind] || cloud) + "</svg>";
}

/* -------------------------------------------------------------- utilities */
var SVGNS = "http://www.w3.org/2000/svg";
function el(name, attrs, text) {
  var n = document.createElementNS(SVGNS, name);
  for (var k in attrs) n.setAttribute(k, attrs[k]);
  if (text != null) n.textContent = text;
  return n;
}
function hhmm(iso)      { return iso.slice(11, 16); }
function round(v, d)    { var m = Math.pow(10, d || 0); return Math.round(v * m) / m; }
function bearing(deg)   { return ["N","NE","E","SE","S","SW","W","NW"][Math.round(deg / 45) % 8]; }

/* ------------------------------------------------------------------- fetch */
function url() {
  return "https://api.open-meteo.com/v1/forecast" +
    "?latitude="  + PLACE.lat +
    "&longitude=" + PLACE.lon +
    "&current=temperature_2m,apparent_temperature,precipitation,weather_code," +
      "wind_speed_10m,wind_gusts_10m,wind_direction_10m,relative_humidity_2m" +
    "&hourly=temperature_2m,apparent_temperature,precipitation,precipitation_probability" +
    "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,sunrise,sunset" +
    "&timezone=Europe%2FHelsinki&wind_speed_unit=ms&forecast_days=2";
}

function load() {
  fetch(url(), { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (d) {
      try { localStorage.setItem(CACHE_KEY, JSON.stringify({ at: Date.now(), d: d })); } catch (e) {}
      draw(d, false);
    })
    .catch(function () {
      // A wall panel must not go blank because the wifi hiccuped: fall back to
      // the last good payload and mark it stale rather than clearing the screen.
      try {
        var c = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
        if (c) draw(c.d, true, c.at);
      } catch (e) {}
    });
}

/* ------------------------------------------------------------------ render */
function draw(d, stale, cachedAt) {
  var cur = d.current, H = d.hourly, D = d.daily;

  var nowIso = cur.time.slice(0, 13);
  var i0 = H.time.findIndex(function (t) { return t.slice(0, 13) === nowIso; });
  if (i0 < 0) i0 = 0;
  var idx = [];
  for (var i = i0; i < Math.min(i0 + HOURS, H.time.length); i++) idx.push(i);

  var desc = describe(cur.weather_code);
  document.getElementById("place").textContent = PLACE.name;
  document.getElementById("date").textContent =
    new Date(cur.time).toLocaleDateString("en-GB",
      { weekday: "long", day: "numeric", month: "long" });
  document.getElementById("nowTemp").textContent   = round(cur.temperature_2m, 0);
  document.getElementById("condition").textContent = desc[0];
  document.getElementById("heroIcon").innerHTML    = icon(desc[1]);
  document.getElementById("feelsLine").innerHTML =
    "Feels like <b>" + round(cur.apparent_temperature, 0) + "&deg;</b> &middot; " +
    round(D.temperature_2m_min[0], 0) + "&deg; / " +
    round(D.temperature_2m_max[0], 0) + "&deg; today";

  var stats = [
    ["Wind",       round(cur.wind_speed_10m, 1), "m/s " + bearing(cur.wind_direction_10m)],
    ["Gusts",      round(cur.wind_gusts_10m, 1), "m/s"],
    ["Rain today", round(D.precipitation_sum[0], 1), "mm"],
    ["Humidity",   Math.round(cur.relative_humidity_2m), "%"]
  ];
  document.getElementById("stats").innerHTML = stats.map(function (s) {
    return '<div><div class="stat-k">' + s[0] + '</div>' +
           '<div class="stat-v">' + s[1] + "<small>" + s[2] + "</small></div></div>";
  }).join("");

  var sunUp = hhmm(D.sunrise[0]), sunDown = hhmm(D.sunset[0]);
  document.getElementById("sunrise").textContent = "↑ " + sunUp;
  document.getElementById("sunset").textContent  = "↓ " + sunDown;
  document.getElementById("updated").innerHTML = stale
    ? '<span class="stale">● offline · last update ' +
      new Date(cachedAt).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }) +
      "</span>"
    : "updated " + hhmm(cur.time);

  drawTemp(H, idx, sunUp, sunDown);
  drawRain(H, idx, sunUp, sunDown);
}

/* Shared geometry so the two charts line up on one time axis. Two measures of
   different scale get two charts sharing an x-axis, never one chart with two
   y-scales. */
var W = 936, PAD_L = 8, PAD_R = 88;   // gutter sized for 40px axis labels
function xAt(k, n) { return PAD_L + (W - PAD_L - PAD_R) * (k / (n - 1)); }

function nightBands(svg, H, idx, h, sunUp, sunDown) {
  // A whisper of shading for the hours after sunset: orientation at a glance,
  // kept well below the data in the visual hierarchy.
  var up = +sunUp.slice(0, 2), down = +sunDown.slice(0, 2), start = null;
  for (var k = 0; k < idx.length; k++) {
    var hr = +H.time[idx[k]].slice(11, 13);
    var night = hr >= down || hr < up;
    if (night && start === null) start = k;
    if ((!night || k === idx.length - 1) && start !== null) {
      var x1 = xAt(start, idx.length), x2 = xAt(k, idx.length);
      svg.appendChild(el("rect", { x: x1, y: 0, width: Math.max(1, x2 - x1),
                                   height: h, fill: "var(--night)" }));
      start = null;
    }
  }
}

function hourAxis(svg, H, idx, y) {
  for (var k = 0; k < idx.length; k += 4) {
    svg.appendChild(el("text", {
      x: xAt(k, idx.length), y: y,
      "text-anchor": k === 0 ? "start" : "middle", "class": "axis"
    }, H.time[idx[k]].slice(11, 13)));
  }
}

function drawTemp(H, idx, sunUp, sunDown) {
  var h = 440, top = 34, bot = 74, plot = h - top - bot;
  var svg = el("svg", { viewBox: "0 0 " + W + " " + h });

  var vals = [], feels = [];
  idx.forEach(function (i) {
    vals.push(H.temperature_2m[i]);
    feels.push(H.apparent_temperature[i]);
  });
  var lo = Math.min.apply(null, vals.concat(feels)) - 1.5;
  var hi = Math.max.apply(null, vals.concat(feels)) + 1.5;
  var y = function (v) { return top + plot * (1 - (v - lo) / (hi - lo)); };

  nightBands(svg, H, idx, h - bot, sunUp, sunDown);

  // Gridlines on whole degrees rather than arbitrary fractions, labelled in
  // the right gutter — so intermediate values are readable without putting a
  // number on every point.
  var span = hi - lo;
  var stepC = span > 18 ? 10 : span > 9 ? 5 : 2;
  for (var g = Math.ceil(lo / stepC) * stepC; g <= hi; g += stepC) {
    var yy = y(g);
    svg.appendChild(el("line", { x1: PAD_L, x2: W - PAD_R, y1: yy, y2: yy, "class": "grid" }));
    svg.appendChild(el("text", { x: W - PAD_R + 12, y: yy + 13, "class": "axis" }, g + "°"));
  }

  var path = function (arr) {
    return arr.map(function (v, k) {
      return (k ? "L" : "M") + round(xAt(k, idx.length), 1) + " " + round(y(v), 1);
    }).join(" ");
  };
  // feels-like first, so the actual temperature reads on top
  svg.appendChild(el("path", { d: path(feels), fill: "none", stroke: "var(--feels)",
    "stroke-width": 2, "stroke-dasharray": "5 5", "stroke-linecap": "round" }));
  svg.appendChild(el("path", { d: path(vals), fill: "none", stroke: "var(--temp)",
    "stroke-width": 2, "stroke-linecap": "round", "stroke-linejoin": "round" }));

  // Selective direct labels: the peak and the trough, never every point. Index
  // 0 is skipped — that sample is "now", which is already the hero number, and
  // labelling it both duplicates the reading and collides with the rising line.
  var maxI = vals.indexOf(Math.max.apply(null, vals));
  var minI = vals.indexOf(Math.min.apply(null, vals));
  var marks = [];
  if (maxI > 0) marks.push([maxI, -15]);
  if (minI > 0 && minI !== maxI) marks.push([minI, 30]);
  marks.forEach(function (p) {
    var k = p[0], cx = xAt(k, idx.length);
    svg.appendChild(el("circle", { cx: cx, cy: y(vals[k]), r: 4, fill: "var(--temp)",
      stroke: "var(--surface)", "stroke-width": 2 }));   // 2px surface ring
    svg.appendChild(el("text", { x: cx, y: y(vals[k]) + p[1],
      "text-anchor": k === 0 ? "start" : (k === idx.length - 1 ? "end" : "middle"),
      "class": "lbl", fill: "var(--temp)" }, round(vals[k], 0) + "°"));
  });

  hourAxis(svg, H, idx, h - 20);
  var box = document.getElementById("tempChart");
  box.innerHTML = "";
  box.appendChild(svg);
}

function drawRain(H, idx, sunUp, sunDown) {
  var mm  = idx.map(function (i) { return H.precipitation[i] || 0; });
  var pop = idx.map(function (i) { return H.precipitation_probability[i] || 0; });
  var peak = Math.max.apply(null, mm);
  var box  = document.getElementById("rainChart");

  var total  = mm.reduce(function (a, b) { return a + b; }, 0);
  var maxPop = Math.max.apply(null, pop);
  // Say the window out loud: the stat row shows the whole calendar day, this
  // chart shows the next 24 h, and the two legitimately differ mid-morning.
  document.getElementById("rainNote").textContent =
    (total > 0 ? round(total, 1) + " mm next 24 h · " : "") + maxPop + "% peak chance";

  // Dry is the common case in a Finnish autumn. Rendering an empty 300px plot
  // (axis, baseline and a stray night band around no data) reads as broken, so
  // say it in one line and give the space back to the layout.
  if (peak <= 0) {
    var flat = el("svg", { viewBox: "0 0 " + W + " 110" });
    flat.appendChild(el("line", { x1: PAD_L, x2: W - PAD_R, y1: 1, y2: 1, "class": "grid" }));
    flat.appendChild(el("text", {
      x: PAD_L, y: 66, "class": "axis"
    }, "No rain expected in the next 24 hours"));
    box.innerHTML = "";
    box.appendChild(flat);
    return;
  }

  var h = 320, top = 26, bot = 74, plot = h - top - bot;
  var svg = el("svg", { viewBox: "0 0 " + W + " " + h });
  var scaleMax = Math.max(1, Math.ceil(peak * 2) / 2);

  nightBands(svg, H, idx, h - bot, sunUp, sunDown);
  svg.appendChild(el("line", { x1: PAD_L, x2: W - PAD_R,
    y1: top + plot, y2: top + plot, "class": "grid" }));

  var step = (W - PAD_L - PAD_R) / idx.length;
  var bw = Math.max(4, step - 2);               // 2px surface gap between bars
  mm.forEach(function (v, k) {
    if (v <= 0) return;
    var bh = Math.max(3, plot * (v / scaleMax));
    svg.appendChild(el("rect", {
      x: PAD_L + step * k + (step - bw) / 2, y: top + plot - bh,
      width: bw, height: bh, rx: 4,             // rounded end, anchored to baseline
      fill: "var(--rain)"
    }));
  });

  var pk = mm.indexOf(peak);
  svg.appendChild(el("text", {
    x: xAt(pk, idx.length),
    y: top + plot - Math.max(3, plot * (peak / scaleMax)) - 9,
    "text-anchor": pk === 0 ? "start" : (pk === idx.length - 1 ? "end" : "middle"),
    "class": "lbl", fill: "var(--rain)"
  }, round(peak, 1) + " mm"));

  hourAxis(svg, H, idx, h - 20);
  box.innerHTML = "";
  box.appendChild(svg);
}

/* --------------------------------------------------------------- lifecycle
   No hover/tooltip layer here, deliberately: the kiosk has no pointing device
   (unclutter hides the cursor and nothing is plugged in), so an interaction
   layer would be dead weight. Everything the charts have to say is on their
   face - direct labels on peak and trough, a legend, and the summary line. */
(function boot() {
  // No usable location means config.js is missing or has no places. Say that on
  // the panel rather than firing a request with "undefined" in the query.
  if (!isFinite(PLACE.lat) || !isFinite(PLACE.lon)) {
    document.getElementById("place").textContent     = "No location set";
    document.getElementById("condition").textContent = "Add CONFIG.places to config.js";
    document.getElementById("nowTemp").textContent   = "–";
    return;
  }
  try {
    var c = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
    if (c) draw(c.d, true, c.at);        // paint from cache instantly, then refresh
  } catch (e) {}
  load();
  setInterval(load, REFRESH_MS);
})();
</script>
</body>
</html>
